# Test-only patch over the production base bundle. The production bundle
# layers own the agent services, tools, persistence plugin, and defaults.
- id: agent-loop
  config:
    agents:
      - id: main
        provider: time-context-mock
        model: time-context-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: time-context-mock-llm
      name: './mock-llm.ts'

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
